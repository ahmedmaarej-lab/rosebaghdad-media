name: telegram-queue
on:
  push:
    branches: [main]
    paths: ['queue/telegram/**']
  schedule:
    - cron: "2,32 6-19 * * *"   # every 30 min, 9:02–22:32 Baghdad
  workflow_dispatch:
permissions:
  contents: write
concurrency: telegram-queue
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send due posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 tools/telegram/send.py
      - name: Save results
        run: |
          git config user.name "rosebaghdad-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A queue
          git diff --cached --quiet || (git commit -m "telegram: sent queue" && git push)
