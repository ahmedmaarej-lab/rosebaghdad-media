name: telegram-queue
on:
  push:
    branches: [main]
    paths: ['queue/telegram/**']
  schedule:
    - cron: "2,32 6-19 * * *"   # backup: every 30 min, 9:02–22:32 Baghdad
  workflow_dispatch:
permissions:
  contents: read
concurrency: telegram-queue
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Restore sent-state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .state
          key: tg-state-${{ github.run_id }}
          restore-keys: tg-state-
      - name: Send due posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 tools/telegram/send.py
      - name: Save sent-state
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .state
          key: tg-state-${{ github.run_id }}
