<!doctype html><html lang="ar"><head><meta charset="utf-8"><style>
/* Carousel slides in the unified cream + gold frame. cover = dark arch with gold title; tip = numbered point; end = offer + order step. */
@font-face{font-family:CG;font-weight:600;src:url(../reel/fonts/cormorant-garamond-latin-600-normal.woff2)}
@font-face{font-family:RQ;font-weight:700;src:url(../reel/fonts/aref-ruqaa-arabic-700-normal.woff2)}
@font-face{font-family:EM;font-weight:500;src:url(../reel/fonts/el-messiri-arabic-500-normal.woff2)}
@font-face{font-family:EM;font-weight:700;src:url(../reel/fonts/el-messiri-arabic-700-normal.woff2)}
@font-face{font-family:CA;font-weight:600;src:url(../reel/fonts/cairo-arabic-600-normal.woff2)}
html,body{margin:0;background:#faf7f0}
#r{width:1080px;height:1350px;position:relative;overflow:hidden;background:#faf7f0;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;direction:rtl}
#fr{position:absolute;left:0;top:0;width:100%;height:100%}
#r>*:not(#fr){position:relative}
.logo{width:230px;margin-top:84px}
.arch{width:760px;height:880px;margin-top:30px;border-radius:380px 380px 14px 14px;overflow:hidden;background:radial-gradient(ellipse 75% 55% at 50% 72%,#6a4720 0%,#3a2611 38%,#1c1209 72%,#120b06 100%);box-shadow:0 0 0 2px #c9ad74,0 0 0 9px #faf7f0,0 0 0 10px rgba(201,173,116,.7),0 26px 40px -18px rgba(61,46,20,.45);display:flex;flex-direction:column;align-items:center}
.arch:before{content:"";position:absolute;inset:16px;border:1px solid rgba(214,186,128,.45);border-radius:inherit}
.kick{font-family:EM;font-weight:700;color:#ecd59c;font-size:34px;margin-top:120px}
.title{font-family:EM;font-weight:700;font-size:84px;line-height:1.35;text-align:center;padding:0 70px;margin-top:14px;background:linear-gradient(180deg,#fbeec6 15%,#e6c57c 55%,#c39a4c 90%);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.cimg{position:absolute;left:50%;bottom:60px;transform:translateX(-50%);filter:drop-shadow(0 20px 24px rgba(0,0,0,.55))}
.orn{color:#d9bf85;font-size:26px;letter-spacing:18px;margin-top:26px}
.swipe{font-family:EM;font-weight:700;font-size:32px;color:#7a6846;margin-top:34px}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:230px;width:100%}
.mid>*{margin-top:0!important}
.mid{gap:44px}
.num{width:180px;height:180px;border-radius:50%;border:2px solid #c9ad74;box-shadow:0 0 0 8px #faf7f0,0 0 0 9px rgba(201,173,116,.6);display:flex;align-items:center;justify-content:center;font-family:EM;font-weight:700;font-size:100px;color:#9a7a3c;margin-top:110px;line-height:1;padding-bottom:10px;box-sizing:border-box}
.h{font-family:EM;font-weight:700;font-size:90px;line-height:1.4;color:#2e281d;text-align:center;padding:0 110px;margin-top:60px;text-wrap:balance}
.dv{display:flex;align-items:center;gap:12px;color:#b39d72;font-size:18px;margin-top:26px}.dv i{display:block;width:120px;height:1px;background:#c9b88f}
.b{font-family:EM;font-weight:500;font-size:54px;line-height:1.75;color:#5a4a2c;text-align:center;padding:0 110px;margin-top:30px;text-wrap:balance}
.pg{position:absolute!important;bottom:150px;font-family:CG;font-weight:600;font-size:28px;letter-spacing:6px;color:#b39d72;direction:ltr}
.url{position:absolute!important;bottom:86px;font-family:CG;font-weight:600;letter-spacing:6px;color:#9a7a3c;font-size:23px;direction:ltr}
.eh{font-family:RQ;font-weight:700;font-size:124px;line-height:1.4;color:#2e281d;margin-top:110px;text-align:center;padding:0 80px}
.pill{font-family:EM;font-weight:700;color:#faf3e3;background:linear-gradient(180deg,#b9a172,#9a7f4b);border-radius:60px;box-shadow:0 10px 18px -10px rgba(61,46,20,.6);font-size:46px;padding:14px 60px 18px;margin-top:50px}
.pill b{color:#f3e2b5;font-weight:500;margin:0 16px}
.cta{font-family:EM;font-weight:700;font-size:50px;color:#3d3023;margin-top:46px}
</style></head><body><div id="r"></div>
<script>
const d=JSON.parse(decodeURIComponent(location.hash.slice(1))),r=document.getElementById('r');
const fr='<img id="fr" src="../frame/frame_feed.png"><img class="logo" src="../reel/horizontal_gold.png">',url='<div class="url">www.rosebaghdad.iq</div>';
if(d.t==='cover') r.innerHTML=fr+`<div class="arch"><div class="kick">${d.kick}</div><div class="title" style="${d.img?'':'margin-top:120px;font-size:96px'}">${d.title}</div>${d.img?`<img class="cimg" src="${d.img}" style="height:${d.ih||360}px">`:'<div class="orn">◆◆◆</div>'}</div><div class="swipe">اسحب وشوف ←</div>`+url;
else if(d.t==='tip') r.innerHTML=fr+`<div class="mid"><div class="num">${d.n}</div><div class="h">${d.h}</div><div class="dv"><i></i>◆<i></i></div><div class="b">${d.b}</div></div><div class="pg">${d.pg}</div>`+url;
else r.innerHTML=fr+`<div class="mid" style="padding-bottom:150px;gap:38px"><div class="eh">${d.h}</div><div class="dv"><i></i>◆<i></i></div><div class="b">${d.b}</div><div class="pill">${d.pill}</div><div class="cta">راسلنا لتثبيت طلبك</div></div>`+url;
</script></body></html>
