<!doctype html><html lang="ar"><head><meta charset="utf-8"><style>
/* Incense card v3: the unified cream + gold frame, with the jar staged in a dark arched niche (majlis arch) so the silver reads as jewellery. */
@font-face{font-family:CG;font-weight:600;src:url(../reel/fonts/cormorant-garamond-latin-600-normal.woff2)}
@font-face{font-family:RQ;font-weight:700;src:url(../reel/fonts/aref-ruqaa-arabic-700-normal.woff2)}
@font-face{font-family:EM;font-weight:500;src:url(../reel/fonts/el-messiri-arabic-500-normal.woff2)}
@font-face{font-family:EM;font-weight:700;src:url(../reel/fonts/el-messiri-arabic-700-normal.woff2)}
html,body{margin:0;background:#faf7f0}
#r{width:1080px;position:relative;overflow:hidden;background:#faf7f0;display:flex;flex-direction:column;align-items:center;box-sizing:border-box}
#fr{position:absolute;left:0;top:0;width:100%;height:100%}
#r>*:not(#fr){position:relative}
.arch{overflow:hidden;background:radial-gradient(ellipse 75% 55% at 50% 70%,#6a4720 0%,#3a2611 38%,#1c1209 72%,#120b06 100%);box-shadow:0 0 0 2px #c9ad74,0 0 0 9px #faf7f0,0 0 0 10px rgba(201,173,116,.7),0 26px 40px -18px rgba(61,46,20,.45);display:flex;flex-direction:column;align-items:center}
.arch:before{content:"";position:absolute;inset:16px;border:1px solid rgba(214,186,128,.45);border-radius:inherit;pointer-events:none}
.kick{font-family:EM;font-weight:700;direction:rtl;color:#ecd59c;position:relative}
.kick:before,.kick:after{content:"";position:absolute;top:55%;width:54px;height:1px;background:linear-gradient(90deg,rgba(217,191,133,0),#d9bf85)}
.kick:before{right:calc(100% + 16px);transform:scaleX(-1)}.kick:after{left:calc(100% + 16px)}
.name{font-family:RQ;font-weight:700;direction:rtl;line-height:1.5;background:linear-gradient(180deg,#fbeec6 15%,#e6c57c 55%,#c39a4c 90%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));position:relative}
.stage{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center}
.spot{position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,220,150,.34) 0%,rgba(255,206,128,.10) 42%,rgba(255,206,128,0) 68%)}
.floor{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(rgba(18,11,6,0),rgba(10,6,3,.85))}
.jar{position:absolute;left:50%;transform:translateX(-50%);filter:drop-shadow(0 22px 26px rgba(0,0,0,.55)) brightness(1.06)}
.refl{position:absolute;left:50%;transform:translateX(-50%) scaleY(-1);opacity:.22;filter:blur(3px);-webkit-mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,0) 38%);mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,0) 38%)}
.smoke{position:absolute;border-radius:50%;filter:blur(26px);background:rgba(255,236,200,.13)}
.hook{font-family:EM;font-weight:700;direction:rtl;color:#3d3023;text-align:center}
.spec{font-family:EM;font-weight:700;direction:rtl;color:#5a4a2c}
.spec b,.pill b{color:#b39d72;font-weight:500;margin:0 14px}
.pill{font-family:EM;font-weight:700;direction:rtl;color:#faf3e3;background:linear-gradient(180deg,#b9a172,#9a7f4b);border-radius:60px;box-shadow:0 10px 18px -10px rgba(61,46,20,.6)}
.pill b{color:#f3e2b5}
.url{font-family:CG;font-weight:600;letter-spacing:6px;color:#9a7a3c}
</style></head><body><div id="r"></div>
<script>
const q=new URLSearchParams(location.search),S=q.get('f')==='story',r=document.getElementById('r');
const AW=S?820:760,AH=S?1040:790,J=S?600:455,k=q.get('k');
r.style.height=(S?1920:1350)+'px';
r.innerHTML=`<img id="fr" src="frame_${S?'story':'feed'}.png">
<img src="../reel/horizontal_gold.png" style="width:${S?300:240}px;margin-top:${S?225:84}px">
<div class="arch" style="width:${AW}px;height:${AH}px;border-radius:${AW/2}px ${AW/2}px 14px 14px;margin-top:${S?44:30}px">
 <div class="kick" style="font-size:${S?40:33}px;margin-top:${S?96:70}px">بخور إماراتي</div>
 <div class="name" style="font-size:${S?176:140}px;margin-top:${S?-26:-26}px">${q.get('name')}</div>
 <div class="stage" style="height:${J*1.25}px">
  <div class="spot" style="width:${J*1.9}px;height:${J*1.9}px;bottom:${-J*.25}px"></div>
  <img class="refl" src="cut/${k}.png" style="height:${J}px;bottom:${J*.11-J}px">
  <div class="floor" style="height:${J*.2}px"></div>
  <img class="jar" src="cut/${k}.png" style="height:${J}px;bottom:${J*.1}px">
 </div>
</div>
<div class="hook" style="font-size:${S?52:42}px;margin-top:${S?44:24}px">${q.get('hook')}</div>
<div class="spec" style="font-size:${S?36:30}px;margin-top:${S?12:2}px">علبة ٦٠ مل<b>◆</b>١٠ أقراص</div>
<div class="pill" style="font-size:${S?42:34}px;padding:${S?'12px 56px 14px':'8px 46px 10px'};margin-top:${S?24:10}px">١٥ ألف دينار<b>◆</b>توصيل مجاني</div>
<div class="url" style="font-size:${S?28:23}px;margin-top:${S?26:10}px">www.rosebaghdad.iq</div>`;
</script></body></html>
