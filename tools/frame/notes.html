<!doctype html><html lang="ar"><head><meta charset="utf-8"><style>
/* Notes slide (2nd carousel image) in the everyday cream + gold frame. ?name=MY WAY&n=<json rows> */
@font-face{font-family:CG;font-weight:600;src:url(../reel/fonts/cormorant-garamond-latin-600-normal.woff2)}
@font-face{font-family:CA;font-weight:600;src:url(../reel/fonts/cairo-arabic-600-normal.woff2)}
@font-face{font-family:CA;font-weight:800;src:url(../reel/fonts/cairo-arabic-800-normal.woff2)}
html,body{margin:0;background:#faf7f0}
#r{width:1080px;height:1350px;position:relative;overflow:hidden;background:#faf7f0;display:flex;flex-direction:column;align-items:center}
#fr{position:absolute;left:0;top:0;width:100%;height:100%}#r>*:not(#fr){position:relative}
.logo{width:260px;margin-top:92px}
.t{font-family:CA;font-weight:800;font-size:54px;color:#2e281d;direction:rtl;margin-top:14px}
.t span{font-family:CG;font-weight:600;letter-spacing:8px;font-size:60px;margin-right:14px}
.row{display:flex;flex-direction:column;align-items:center;margin-top:10px}
.lab{display:flex;align-items:center;gap:14px;font-family:CA;font-weight:600;font-size:28px;color:#9a7a3c;direction:rtl}
.lab i{display:block;width:110px;height:1px;background:#c9b88f}
.ms{display:flex;gap:44px;margin-top:12px;direction:rtl}
.m{display:flex;flex-direction:column;align-items:center;width:200px}
.c{width:120px;height:120px;border-radius:50%;background:#fff;border:2px solid #b39d72;box-shadow:0 0 0 7px #faf7f0,0 0 0 8px #d9cba8;display:flex;align-items:center;justify-content:center}
.c svg{width:80px;height:80px;stroke:#9a7a3c;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.nm{font-family:CA;font-weight:800;font-size:29px;color:#3d3627;margin-top:10px;direction:rtl;white-space:nowrap}
.pill{font-family:CA;font-weight:600;direction:rtl;background:#f4e2dc;color:#3d3627;border-radius:60px;font-size:30px;padding:6px 40px 10px;margin-top:16px}
.pill b{color:#b39d72;font-weight:600;margin:0 14px}
.url{font-family:CG;font-weight:600;letter-spacing:6px;color:#9a7a3c;font-size:26px;position:absolute!important;left:0;right:0;bottom:84px;text-align:center}
</style></head><body><div id="r"></div><script>

document.getElementById('r').innerHTML=`<img id="fr" src="frame_feed.png"><img class="logo" src="../reel/horizontal_gold.png">
<div class="t">نوتات<span>${name}</span></div>`+rows.map(([lab,ns])=>`<div class="row"${rows.length==1?' style="margin:200px 0 160px"':''}><div class="lab"><i></i>${lab}<i></i></div><div class="ms">${ns.map(([n,ic])=>`<div class="m"><div class="c"><svg viewBox="0 0 100 100">${I[ic]}</svg></div><div class="nm">${n}</div></div>`).join('')}</div></div>`).join('')+
