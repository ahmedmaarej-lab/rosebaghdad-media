<!doctype html><html lang="ar"><head><meta charset="utf-8"><style>
@font-face{font-family:CA;font-weight:800;src:url(../reel/fonts/cairo-arabic-800-normal.woff2)}
@font-face{font-family:CA;font-weight:600;src:url(../reel/fonts/cairo-arabic-600-normal.woff2)}
@font-face{font-family:CL;font-weight:500;src:url(../reel/fonts/cairo-latin-500-normal.woff2)}
html,body{margin:0;background:transparent}
#r{width:1080px;height:1920px;position:relative;overflow:hidden}
.logo{position:absolute;left:50%;top:150px;transform:translateX(-50%);background:rgba(43,34,22,.55);border-radius:60px;padding:14px 34px;display:flex}
.logo img{height:74px}
.cap{position:absolute;left:90px;right:90px;top:1230px;display:flex;justify-content:center}
.cap div{direction:rtl;text-align:center;font:800 66px/1.35 CA,sans-serif;color:#fff7e6;background:rgba(43,34,22,.78);border-radius:28px;padding:14px 38px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.cap b{color:#f0c86a;font-weight:800}
.end{position:absolute;left:0;right:0;top:1080px;display:flex;flex-direction:column;align-items:center;gap:18px}
.end .lg{background:rgba(43,34,22,.82);border-radius:40px;padding:12px 30px;display:flex}.end .lg img{height:64px}
.end .t{direction:rtl;font:800 58px/1.3 CA,sans-serif;color:#fff7e6;background:rgba(43,34,22,.82);border-radius:30px;padding:14px 44px}
.end .u{font:500 40px CL,CA,sans-serif;color:#2b2216;background:#f0c86a;border-radius:60px;padding:8px 40px;letter-spacing:.02em}
</style></head><body><div id="r"></div><script>
const q=new URLSearchParams(location.search),k=q.get('kind'),t=q.get('text')||'',r=document.getElementById('r');
if(k==='logo')r.innerHTML='<div class="logo"><img src="../reel/horizontal_gold.png"></div>';
else if(k==='end'){const [a,b]=t.split('|');r.innerHTML=`<div class="end"><div class="lg"><img src="../reel/horizontal_gold.png"></div><div class="t">${a}</div><div class="u">${b||'www.rosebaghdad.iq'}</div></div>`}
else r.innerHTML=`<div class="cap"><div>${t}</div></div>`;
</script></body></html>
